[project]
name = "tldr-daemon"
version = "0.1.0"
description = "Local FastAPI daemon for summarizing pages and YouTube videos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "yt-dlp>=2024.4.9",
    "youtube-transcript-api>=0.6.2",
    "static-ffmpeg>=2.5",
    "yt-dlp-ejs>=0.8",
    "langdetect>=1.0.9",
    "openai>=1.50",
    "sqlmodel>=0.0.16",
    "trafilatura>=1.12",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    "tenacity>=8.2",
    "nanoid>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "ddgs>=1.0",
    # OS keychain (macOS Keychain / Linux Secret Service) storage for the LLM
    # API key. A base dependency (not optional) since headless operation is
    # unsupported — a human is always at the browser, so keychain access
    # dialogs are never a problem — and this is now the recommended default
    # storage mode (see PATCH /config default in src/api/config.py).
    "keyring>=25",
]

[project.scripts]
tldr-daemon = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# Non-.py files that must ship in the wheel for native (uv) installs:
# LLM prompt templates and the config template auto-created on first run.
[tool.setuptools.package-data]
"src.prompts" = ["*.txt"]
"src.assets" = ["*.example"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
