<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TLDR — Options</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 1.5rem 2rem;
        max-width: 640px;
      }
      h1 { margin-top: 0; }
      h2 { margin-bottom: 0.25rem; font-size: 1.05rem; }
      section {
        margin: 1.5rem 0;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid #e0e0e0;
      }
      section:last-of-type { border-bottom: none; }
      label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
      label.sentence-field {
        font-weight: 400;
        line-height: 1.7;
      }
      label.sentence-field input[type="number"] {
        width: 5em;
        display: inline-block;
        margin: 0 0.35rem;
        vertical-align: baseline;
      }
      label.checkbox-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 400;
        margin-top: 0.75rem;
      }
      label.checkbox-label input[type="checkbox"] {
        width: auto;
        margin: 0;
      }
      input, select { width: 100%; padding: 0.5rem; font: inherit; box-sizing: border-box; }
      input:disabled, select:disabled, button:disabled { opacity: 0.6; cursor: not-allowed; }
      button { margin-top: 1rem; padding: 0.5rem 1rem; font: inherit; }
      fieldset { border: none; margin: 0; padding: 0; }
      .hint { margin: 0.25rem 0 0; font-size: 0.85rem; color: #5f6368; }
      .ok { color: #137333; }
      .err { color: #c5221f; }
      .notice {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        background: #fef7e0;
        border: 1px solid #f2c94c;
        font-size: 0.9rem;
      }
      .notice.err {
        background: #fce8e6;
        border-color: #f28b82;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f8f9fa;
        border: 1px solid #dadce0;
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
        font-size: 0.85rem;
        margin: 0.5rem 0;
      }
      #test-result, #whisper-test-result { margin-top: 0.5rem; }
      #test-result ul, #whisper-test-result ul { margin: 0.25rem 0 0; padding-left: 1.25rem; }
      details summary { cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>TLDR — Options</h1>

    <div id="config-unavailable" class="notice err" hidden></div>

    <fieldset id="settings-fieldset" disabled>
      <section>
        <h2>LLM backend</h2>

        <label for="llm-base-url">Base URL</label>
        <input id="llm-base-url" type="url" placeholder="http://127.0.0.1:1240/v1" />

        <label for="llm-model">Model</label>
        <!-- datalist only, never <select>: this stays free text. Cloud
             endpoints can list hundreds of models, some backends don't
             enumerate everything they can serve, and the user may want a
             name that isn't in the list at all — the datalist is a hint,
             not a constraint. -->
        <input id="llm-model" type="text" placeholder="gemma-4-e4b-it-qat-q4_0" list="llm-model-list" />
        <datalist id="llm-model-list"></datalist>

        <label for="llm-context-length">Context length (tokens)</label>
        <input id="llm-context-length" type="number" min="1" step="1" />

        <label for="llm-single-pass-limit">Single-pass token limit</label>
        <input id="llm-single-pass-limit" type="number" min="1" step="1" />

        <label for="llm-max-concurrent">Max concurrent calls</label>
        <input id="llm-max-concurrent" type="number" min="1" step="1" />

        <label for="llm-reasoning-effort">Reasoning effort</label>
        <input id="llm-reasoning-effort" type="text" placeholder="e.g. low, none — leave empty for null" />

        <label for="llm-api-key">API key</label>
        <input id="llm-api-key" type="password" autocomplete="off" placeholder="no API key set" />
        <p id="llm-api-key-source" class="hint"></p>

        <label for="llm-api-key-storage">Store key in</label>
        <select id="llm-api-key-storage">
          <option id="llm-api-key-storage-keychain-option" value="keychain">OS keychain (recommended)</option>
          <option value="file">File (needed for Docker installs)</option>
          <option value="inline">Inline in config</option>
        </select>
        <p id="llm-api-key-storage-hint" class="hint" hidden></p>
        <p id="api-key-verify-result" class="hint"></p>

        <button id="test-connection" type="button">Test connection</button>
        <div id="test-result"></div>
      </section>

      <section>
        <h2>Whisper backend</h2>

        <label for="whisper-base-url">Base URL</label>
        <input id="whisper-base-url" type="url" placeholder="http://127.0.0.1:1240/v1" />

        <label for="whisper-model">Model</label>
        <input id="whisper-model" type="text" placeholder="whisper-large-q5_0" />

        <label for="whisper-max-upload">Max upload size (MB)</label>
        <input id="whisper-max-upload" type="number" min="1" step="1" />

        <label for="whisper-api-key">API key</label>
        <input id="whisper-api-key" type="password" autocomplete="off" placeholder="no API key set" />
        <p id="whisper-api-key-source" class="hint"></p>

        <label for="whisper-api-key-storage">Store key in</label>
        <select id="whisper-api-key-storage">
          <option id="whisper-api-key-storage-keychain-option" value="keychain">OS keychain (recommended)</option>
          <option value="file">File (needed for Docker installs)</option>
          <option value="inline">Inline in config</option>
        </select>
        <p id="whisper-api-key-storage-hint" class="hint" hidden></p>
        <p id="whisper-api-key-verify-result" class="hint"></p>

        <button id="whisper-test-connection" type="button">Test connection</button>
        <div id="whisper-test-result"></div>
      </section>

      <section>
        <h2>Output</h2>

        <label for="output-language">Language</label>
        <input id="output-language" type="text" placeholder="en, auto, …" />
      </section>

      <section>
        <h2>Storage</h2>

        <label class="sentence-field" for="storage-retention-days">
          Delete jobs
          <input id="storage-retention-days" type="number" min="1" step="1" />
          days after they're added to this library
        </label>
        <p class="hint">
          Imported jobs count from the day you imported them, not the day the
          video was processed.
        </p>

        <label class="checkbox-label" for="storage-never-delete">
          <input id="storage-never-delete" type="checkbox" />
          Never delete automatically
        </label>
      </section>

      <button id="save-settings" type="button">Save settings</button>
      <span id="settings-status"></span>
      <div id="restart-notice" class="notice" hidden></div>
    </fieldset>

    <section>
      <h2>Daemon</h2>

      <label for="daemon-url">Daemon URL</label>
      <input id="daemon-url" type="url" placeholder="http://127.0.0.1:8765" />

      <button id="save-daemon">Save</button>
      <span id="daemon-status"></span>
    </section>

    <script type="module" src="./options.js"></script>
  </body>
</html>
