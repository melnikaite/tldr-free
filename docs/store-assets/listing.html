<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Chrome Web Store listing screenshot: 1280x800 canvas with the REAL side
     panel document rendered in an iframe at its real width (400px), so the
     panel content is the extension's own output, not a mockup. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    background: #1a73e8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 64px;
  }
  .copy { width: 470px; color: #fff; }
  .copy h1 { font-size: 46px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
  .copy p { font-size: 22px; line-height: 1.45; margin-top: 20px; opacity: 0.9; }
  .panel {
    width: 400px; height: 660px;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.32);
    background: #202124;
  }
  .panel iframe { width: 400px; height: 660px; border: 0; display: block; }
</style>
</head>
<body>
  <div class="copy">
    <h1>One local program, then you're done.</h1>
    <p>TLDR tells you exactly what it needs on first run — no account, no sign-up, and nothing sent anywhere you didn't choose.</p>
  </div>
  <div class="panel">
    <iframe src="welcome-shot.html?step=daemon" title="TLDR side panel, first run"></iframe>
  </div>
</body>
</html>
